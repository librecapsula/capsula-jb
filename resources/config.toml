# capsula-jb — конфигурация инструмента.
#
# Лоадер один на все платы: подписанный usbplug из OTA Capsule-14 44.90.
# Он вшит в бинарник (resources/loader/loader.bin) — сеть не нужна.

# Константы RAM-патча usbplug. read_limit_addr указывает на u32 LE —
# предел чтения (в секторах) внутри работающего usbplug; стоковое
# значение 0x10000, всё выше читается как 0xCC, поэтому перед дампом
# предел поднимается до размера флеша.
[usbplug]
read_limit_addr = 0x3343ec4
signature1_addr = 0x03012290
signature1_hex = "29c54eb91f01096b02030054"
signature2_addr = 0x03012390
signature2_hex = "29c54eb91f01096bc2000054"

[hint]
capsula_connect_text = """
1. Отключите питание
2. Отклейте нижнюю сиилконовую накладку
3. Подключите micro-USB кабель к колонке и компьютеру
4. Скрепкой зажмите кнопку Recovery — ближнее к центру из двух отверстий над micro-USB разъемом. Убедитесь, что вы чувствуете уверенный щелчок
5. Удерживая кнопку, подайте питание. Отпустите через несколько секунд
"""

capsula_mini_amlogic_connect_text = """
Подключите устройство к компьютеру через USB Type A -> USB Type C кабель.
Если утилита работает со сбоями, используйте USB-хаб
"""
