[workspace]
resolver = "3"
members = [
    "crates/rockusb",
    "crates/amlogic",
    "crates/jb-core",
    "crates/jb-rockchip",
    "crates/jb-amlogic",
    "crates/jb-cli",
    "crates/jb-tui",
    "crates/win-drv",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/LibreCapsula/capsula-jb"

[workspace.dependencies]
# internal
rockusb = { path = "crates/rockusb" }
amlogic = { path = "crates/amlogic" }
jb-core = { path = "crates/jb-core" }
jb-rockchip = { path = "crates/jb-rockchip" }
jb-amlogic = { path = "crates/jb-amlogic" }
jb-tui = { path = "crates/jb-tui" }
win-drv = { path = "crates/win-drv" }

# usb / protocol
nusb = "0.2"

# errors / misc
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

# formats / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
crc32fast = "1"
hex = "0.4"

# userdata overlay: ext2/3/4 via lwext4 (compiled with cc, no runtime deps)
ext4-lwext4 = "0.1"
cc = "1"

# the amlogic data partition is UBI/UBIFS: read the capture, inject the
# overlay, repack (mkfs.ubifs/ubinize-compatible, pure Rust)
ubifs = "0.1"

# cli / progress / gui
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
# The terminal UI (ratatui; pure Rust — works on macOS, Windows and
# Linux including the aarch64 CI cross-build). crossterm comes through
# ratatui's re-export, so the versions cannot drift apart.
ratatui = "0.30"

[profile.release]
lto = "thin"
strip = "symbols"
